<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F3EFDE; }
      .line { stroke: #3A2318; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .red { fill: #BA1C21; }
      .pink { fill: #E2899A; }
      .gold { fill: #B68F3B; }
      .grey { fill: #9A9995; }
    </style>
    
    <g id="starburst">
      <line x1="0" y1="-15" x2="0" y2="15" class="line" />
      <line x1="-15" y1="0" x2="15" y2="0" class="line" />
      <line x1="-10" y1="-10" x2="10" y2="10" class="line" />
      <line x1="-10" y1="10" x2="10" y2="-10" class="line" />
    </g>
  </defs>

  <rect width="400" height="500" class="bg" />

  <path d="M 0,100 A 80,80 0 0,1 120,180 L 120,300 L 0,300 Z" class="pink" opacity="0.8"/>
  <rect x="250" y="50" width="90" height="120" class="gold" opacity="0.9" />
  <circle cx="80" cy="380" r="45" class="gold" />
  <path d="M 280,300 L 380,300 L 380,450 L 280,400 Z" class="red" opacity="0.8"/>
  <path d="M 200,0 L 280,80 L 200,80 Z" class="grey" />

  <path d="M 120,0 L 120,350 L 250,350 L 250,500" class="line" />
  <path d="M 0,250 L 400,250" class="line" />
  <path d="M 0,100 C 100,100 150,150 150,250" class="line" />
  <path d="M 250,100 L 400,100" class="line" />
  <path d="M 70,350 L 70,500" class="line" />

  <line x1="125" y1="260" x2="155" y2="290" class="line" />
  <line x1="135" y1="260" x2="165" y2="290" class="line" />
  <line x1="145" y1="260" x2="175" y2="290" class="line" />
  <line x1="155" y1="260" x2="185" y2="290" class="line" />

  <g transform="translate(180, 40)">
    <path d="M 10,20 L 40,20 L 45,50 L 5,50 Z" class="pink" />
    <path d="M 5,55 L 45,55 L 35,110 L 15,110 Z" class="pink" />
    <path d="M 15,0 L 35,0 L 35,15 L 15,15 Z" class="line" />
    <path d="M 5,20 L 45,20 L 45,50 L 5,50 Z" class="line" />
    <path d="M 2,55 L 48,55 L 38,120 L 12,120 Z" class="line" />
  </g>

  <g transform="translate(40, 180)">
    <path d="M 10,20 C 10,50 60,50 60,20 Z" class="gold" />
    <line x1="35" y1="45" x2="35" y2="90" class="line" />
    <line x1="15" y1="90" x2="55" y2="90" class="line" />
    <path d="M 10,20 C 10,50 60,50 60,20 Z" class="line" stroke-width="3" />
  </g>

  <g transform="translate(280, 260)">
    <path d="M 10,0 L 60,0 L 35,40 Z" class="line" />
    <line x1="35" y1="40" x2="35" y2="80" class="line" />
    <line x1="15" y1="80" x2="55" y2="80" class="line" />
    <circle cx="35" cy="20" r="8" class="red" />
  </g>

  <use href="#starburst" x="280" y="180" />
  <use href="#starburst" x="230" y="300" transform="scale(0.7)" />
  <use href="#starburst" x="80" y="440" transform="scale(1.2)" />
  <circle cx="280" cy="50" r="12" class="red" />
  <line x1="280" y1="50" x2="280" y2="90" class="line" />

</svg>
