<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background Mora -->
  <rect width="1200" height="630" fill="#4A2540"/>

  <!-- Dot grid (Panna 20%) -->
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#F7F2E5" opacity="0.20"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Bracket (Panna 45%) -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#F7F2E5" stroke-width="0.5" opacity="0.45"/>
  <rect x="52" y="52" width="1096" height="526" fill="none" stroke="#F7F2E5" stroke-width="0.5" opacity="0.20"/>

  <!-- Overline (Basilico) -->
  <text x="100" y="150" font-family="'Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2E4A36" letter-spacing="6">PRIMA EDIZIONE · 2027</text>

  <!-- Star (Bitter) -->
  <text x="100" y="230" font-family="Georgia,serif" font-size="28" fill="#B83A2E" opacity="0.9">✶</text>

  <!-- Titolo (Panna) -->
  <text x="100" y="320" font-family="Georgia,'Didot','Playfair Display',serif" font-size="80" font-weight="900" fill="#F7F2E5" letter-spacing="-2">MILAN</text>
  <text x="100" y="410" font-family="Georgia,'Didot','Playfair Display',serif" font-size="80" font-weight="900" fill="#F7F2E5" letter-spacing="-2">COCKTAIL</text>
  <text x="100" y="500" font-family="Georgia,'Didot','Playfair Display',serif" font-size="80" font-weight="900" fill="#B83A2E" letter-spacing="-2">DAYS</text>

  <!-- Sottotitolo (Pesco-300) -->
  <text x="100" y="560" font-family="'Arial','Helvetica',sans-serif" font-size="16" fill="#F2C5CD" letter-spacing="4" opacity="0.7">MILANO · APRILE–MAGGIO 2027</text>
</svg>
