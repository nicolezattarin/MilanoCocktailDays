<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Milano Cocktail Days — SEO/GEO Growth Plan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{--bg:#0E0B08;--bg2:#141008;--bg3:#1A1410;--border:#2A221A;--gold:#C4850D;--gold-lt:#F0C060;--gold-dim:#7A5008;--cream:#B8AC9A;--cream-dim:#6A5E50;--white:#F2EDE6;--red:#C0392B;--green:#27AE60;--blue:#2980B9;--purple:#8E44AD;--orange:#E67E22}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;line-height:1.6}
  .header{border-bottom:1px solid var(--border);padding:28px 48px 24px;background:var(--bg2);position:sticky;top:0;z-index:100;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  .header-left h1{font-family:'Bodoni Moda',serif;font-size:20px;font-weight:600;color:var(--white);letter-spacing:.04em}
  .header-left p{font-size:11px;color:var(--cream-dim);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
  .header-progress{display:flex;align-items:center;gap:12px}
  .progress-ring-wrap{position:relative;width:52px;height:52px}
  .progress-ring-wrap svg{transform:rotate(-90deg)}
  .progress-ring-bg{fill:none;stroke:var(--border);stroke-width:3}
  .progress-ring-fill{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-dasharray:138;stroke-dashoffset:138;transition:stroke-dashoffset .6s ease}
  .progress-ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gold)}
  .progress-label{font-size:11px;color:var(--cream-dim);text-align:right;line-height:1.4}
  .progress-label strong{color:var(--cream);display:block;font-size:13px}
  .container{max-width:1100px;margin:0 auto;padding:36px 48px 80px}
  .phase{margin-bottom:28px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .phase-header{display:flex;align-items:center;gap:14px;padding:14px 20px;cursor:pointer;user-select:none;background:var(--bg2);transition:background .2s}
  .phase-header:hover{background:var(--bg3)}
  .phase-accent{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0}
  .phase-meta{flex:1}
  .phase-num{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-dim);margin-bottom:2px}
  .phase-title{font-family:'Bodoni Moda',serif;font-size:16px;color:var(--white);font-weight:600}
  .phase-subtitle{font-size:11px;color:var(--cream-dim);margin-top:2px}
  .phase-stats{display:flex;align-items:center;gap:14px}
  .phase-count{font-size:11px;color:var(--cream-dim)}
  .phase-arrow{font-size:10px;color:var(--cream-dim);transition:transform .25s}
  .phase.open .phase-arrow{transform:rotate(180deg)}
  .phase-bar-wrap{width:80px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px}
  .phase-bar{height:100%;border-radius:2px;transition:width .4s ease}
  .tasks{display:none;background:var(--bg)}
  .phase.open .tasks{display:block}
  .task{display:grid;grid-template-columns:20px 1fr auto;align-items:start;gap:14px;padding:13px 20px;border-top:1px solid var(--border);cursor:pointer;transition:background .15s;position:relative}
  .task:hover{background:#ffffff05}
  .task-check{width:18px;height:18px;border:1.5px solid var(--cream-dim);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s}
  .task.done .task-check{background:var(--gold);border-color:var(--gold)}
  .task.done .task-check::after{content:'✓';font-size:11px;color:var(--bg);font-weight:700}
  .task-body{min-width:0}
  .task-title{font-size:13px;color:var(--cream);font-weight:500;line-height:1.4}
  .task.done .task-title{text-decoration:line-through;color:var(--cream-dim)}
  .task-desc{font-size:11.5px;color:var(--cream-dim);margin-top:4px;line-height:1.5}
  .task-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--gold);text-decoration:none;margin-top:5px;opacity:.8;transition:opacity .2s}
  .task-link:hover{opacity:1}
  .task-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
  .tag{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .tag-done{background:#1A1A1A;color:#555}
  .tag-code{background:#0F2010;color:#5cb85c}
  .tag-seo{background:#200F0F;color:#e07b5b}
  .tag-geo{background:#0A1F22;color:#5bc4c4}
  .tag-analytics{background:#0F1520;color:#5b8dee}
  .tag-legal{background:#221A08;color:#d4a855}
  .tag-social{background:#1F0F22;color:#c47adb}
  .tag-content{background:#1A1220;color:#a07bdb}
  .tag-critical{background:#200808;color:#e05b5b}
  .priority{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .p-high{background:#e05b5b}.p-medium{background:#d4a855}.p-low{background:#5b8dee}
  .status{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
  .status-done{background:#0F2010;color:#5cb85c}
  .status-inprog{background:#221A08;color:#d4a855}
  .status-todo{background:#1A1A1A;color:#555}
  .status-waiting{background:#0A1520;color:#5b8dee}
  /* PROMPT PANEL */
  .prompt-panel{margin:0 20px 14px;border:1px solid var(--gold-dim);border-radius:8px;overflow:hidden;background:#0A0800}
  .prompt-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#110D00;border-bottom:1px solid var(--gold-dim)}
  .prompt-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
  .prompt-copy{font-size:10px;color:var(--cream-dim);background:transparent;border:1px solid var(--border);border-radius:4px;padding:3px 10px;cursor:pointer;transition:all .2s;font-family:'Jost',sans-serif}
  .prompt-copy:hover{background:var(--gold-dim);color:var(--white);border-color:var(--gold-dim)}
  .prompt-copy.copied{background:#0F2010;color:#5cb85c;border-color:#27AE6044}
  .prompt-body{padding:14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#C8BCA8;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow-y:auto}
  .prompt-body::-webkit-scrollbar{width:4px}
  .prompt-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .prompt-toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gold-dim);cursor:pointer;padding:8px 20px 12px;border-top:1px solid var(--border);background:var(--bg);transition:color .2s;user-select:none}
  .prompt-toggle:hover{color:var(--gold)}
  .prompt-toggle-icon{font-size:9px;transition:transform .2s}
  .prompt-open .prompt-toggle-icon{transform:rotate(180deg)}
  /* TOOLS */
  .tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:16px 20px;border-top:1px solid var(--border);background:var(--bg)}
  .tool-card{border:1px solid var(--border);border-radius:8px;padding:14px;background:var(--bg2);transition:border-color .2s}
  .tool-card:hover{border-color:var(--gold-dim)}
  .tool-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .tool-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .tool-name{font-size:12px;font-weight:700;color:var(--white)}
  .tool-type{font-size:10px;color:var(--cream-dim)}
  .tool-desc{font-size:11px;color:var(--cream-dim);line-height:1.5}
  .tool-status{margin-top:8px;font-size:10px;font-weight:600;display:flex;align-items:center;gap:5px}
  .dot-green{width:6px;height:6px;border-radius:50%;background:#27AE60}
  .dot-yellow{width:6px;height:6px;border-radius:50%;background:#d4a855}
  .dot-red{width:6px;height:6px;border-radius:50%;background:#e05b5b}
  .timeline{padding:16px 20px;border-top:1px solid var(--border);background:var(--bg);display:grid;grid-template-columns:repeat(5,1fr);gap:0}
  .tl-col{position:relative}
  .tl-col+.tl-col{border-left:1px solid var(--border);padding-left:14px}
  .tl-col:not(:last-child){padding-right:14px}
  .tl-period{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  .tl-item{font-size:11px;color:var(--cream-dim);padding:4px 0;line-height:1.4;border-left:2px solid transparent;padding-left:8px;margin-bottom:4px;transition:border-color .2s}
  .tl-item:hover{border-left-color:var(--gold-dim);color:var(--cream)}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>Milano Cocktail Days — SEO/GEO Growth Plan</h1>
    <p>SEO · GEO · Analytics · Presence · Content · milanococktaildays.it</p>
  </div>
  <div class="header-progress">
    <div class="progress-ring-wrap">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle class="progress-ring-bg" cx="26" cy="26" r="22"/>
        <circle class="progress-ring-fill" id="ring-fill" cx="26" cy="26" r="22"/>
      </svg>
      <div class="progress-ring-text" id="ring-pct">0%</div>
    </div>
    <div class="progress-label"><strong id="global-count">0 / 0</strong>task completate</div>
  </div>
</div>
<div class="container" id="phases"></div>
<script>
const NO_PROMPT = null;
const data = [
  {
    num:'01',title:'Fondamenta Tecniche',subtitle:'Astro config · Sitemap · Robots · hreflang · Noindex',color:'#C4850D',
    tasks:[
      {title:'astro.config.mjs — site: corretto',desc:'Il campo site: è prerequisito per canonical URL, sitemap e og:url automatici. Già configurato con milanococktaildays.it.',tag:'code',status:'done',priority:'high',prompt:NO_PROMPT},
      {title:'@astrojs/sitemap installato e filter /grazie attivo',desc:'Genera sitemap-0.xml ad ogni build. Filter esclude /grazie/ e /grazie-partner/.',tag:'code',status:'done',priority:'high',prompt:NO_PROMPT},
      {title:'public/robots.txt con Sitemap URL corretto',desc:'Già presente. Punta a https://milanococktaildays.it/sitemap-index.xml.',tag:'code',status:'done',priority:'high',prompt:NO_PROMPT},
      {title:'hreflang IT/EN su tutte le pagine',desc:'Già implementato in BaseLayout.astro con getAlternateUrl() e alternates array.',tag:'seo',status:'done',priority:'high',prompt:NO_PROMPT},
      {title:'noindex + rimozione sitemap su /grazie/ e /grazie-partner/',desc:'Pagine di conferma form da escludere dall\'indicizzazione Google.',tag:'seo',status:'todo',priority:'high',
        prompt:`I'm working on an Astro 6 site for Milano Cocktail Days (https://milanococktaildays.it).
The site has these thank-you pages that must NOT be indexed by Google:
- src/pages/grazie.astro
- src/pages/grazie-partner.astro
- src/pages/en/grazie.astro (if it exists)
- src/pages/en/grazie-partner.astro (if it exists)

BaseLayout.astro already accepts a noindex prop that adds <meta name="robots" content="noindex, nofollow">.

Please:
1. Open each grazie page and add noindex={true} to the <BaseLayout> component call.
2. Check astro.config.mjs — the sitemap filter should already exclude /grazie paths.
   If not, update it to:
   filter: (page) => !page.includes('/grazie') && !page.includes('/grazie-partner')
3. Run: npm run build
4. Confirm dist/sitemap-0.xml does NOT contain /grazie/ or /grazie-partner/ URLs.
Show all files modified.`},
      {title:'og-default.jpg 1200×630px — sostituire placeholder SVG',desc:'Facebook e WhatsApp non renderizzano SVG. Serve JPG con branding MCD.',tag:'code',status:'todo',priority:'medium',
        link:'https://developers.facebook.com/tools/debug',linkLabel:'Testa su Facebook Debugger →',
        prompt:`I'm working on an Astro 6 site for Milano Cocktail Days.
The file public/og-default.svg is a placeholder — Facebook and WhatsApp don't render SVG og:images.

Please:
1. Create a script scripts/generate-og.js using Sharp (install if needed: npm install sharp)
   that generates public/og-default.jpg at 1200×630px.
   The image should have:
   - Background color: #1A1410 (dark brown, MCD brand)
   - Centered text "Milano Cocktail Days" in white
   - Subtitle: "Festival dei Cocktail Bar · Milano · Aprile–Maggio 2027"
   - A thin gold (#C4850D) horizontal line as decoration
   This is a placeholder until the real branded image is designed.
2. Run the script: node scripts/generate-og.js
3. Verify public/og-default.jpg exists and is ~1200×630px.
4. Check BaseLayout.astro — ogImage already defaults to /og-default.jpg, no code change needed.
Show the script and confirm the file was generated.`},
      {title:'apple-touch-icon.png 180×180px',desc:'PNG logo MCD su sfondo #1A1410 per home screen iOS.',tag:'code',status:'todo',priority:'low',
        prompt:`I'm working on an Astro 6 site for Milano Cocktail Days.
The file public/apple-touch-icon.png does not exist yet.

Please:
1. Create a script scripts/generate-icons.js using Sharp
   that generates public/apple-touch-icon.png at 180×180px with:
   - Background: #1A1410
   - Centered text "MCD" in gold (#C4850D) as placeholder
2. Run: node scripts/generate-icons.js
3. Check if src/layouts/BaseLayout.astro has <link rel="apple-touch-icon">.
   If not, add: <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
4. Run: npm run build — confirm no errors.
Show all files created or modified.`},
    ]
  },
  {
    num:'02',title:'On-Page SEO',subtitle:'Meta · OG · Canonical · Heading · Alt text',color:'#E07B5B',
    tasks:[
      {title:'SEO component con title, description, canonical, OG, Twitter',desc:'Già in BaseLayout.astro con fullTitle, canonical, ogImageAbsolute, ogLocale. Completo.',tag:'seo',status:'done',priority:'high',prompt:NO_PROMPT},
      {title:'lang="it" IT / lang="en" EN gestito automaticamente',desc:'BaseLayout già gestisce lang da pathname. Nessuna azione richiesta.',tag:'seo',status:'done',priority:'high',prompt:NO_PROMPT},
      {title:'Title univoco ogni pagina con keyword + "Milano Cocktail Days 2027"',desc:'fullTitle in BaseLayout già applica il pattern. Verificare le singole pagine.',tag:'seo',status:'done',priority:'high',prompt:NO_PROMPT},
      {title:'Description 150–160 caratteri specifica per ogni pagina',desc:'Verifica che sponsor.astro, bar.astro, festival.astro abbiano description reale non generica.',tag:'seo',status:'inprog',priority:'medium',
        prompt:`I'm working on an Astro 6 site for Milano Cocktail Days (https://milanococktaildays.it).

Please audit every page in src/pages/ (including /en/ subfolder) for SEO meta descriptions:

1. Open each .astro page and check the description prop passed to BaseLayout.
2. For any page with a generic, too short (<100 chars), or missing description, rewrite it:
   - Target: 150–160 characters
   - Include: "Milano Cocktail Days", a keyword relevant to that page, and "Milano"
   - Make it compelling (invites the click, not just a summary)
   - Italian for IT pages, English for EN pages

Target descriptions per page:
- index: festival diffuso cocktail bar Milano, 10 giorni aprile-maggio 2027, pass unico
- festival: come funziona il festival, 30 bar, cocktail a €6, pass festival e VIP
- bar: i cocktail bar partner di Milano Cocktail Days, Navigli Brera Isola
- sponsor: partnership per brand beverage tech mobility, pubblico premium 25-40 Milano
- contatti: acquista il pass Milano Cocktail Days, lista d'attesa, domande frequenti

3. Show a table of: page / old description / new description / character count.
4. Apply all changes.`},
      {title:'Alt text descrittivo IT su tutte le immagini',desc:'Alt vuoti o generici penalizzano SEO. Ogni img deve descrivere il contenuto con keyword naturali.',tag:'seo',status:'todo',priority:'medium',
        prompt:`I'm working on an Astro 6 site for Milano Cocktail Days (https://milanococktaildays.it).

Please audit all <img> tags across src/pages/ and src/components/ for alt text:

1. Find every <img> tag.
2. For decorative images (hero bg, overlays): alt="" is correct — keep it.
3. For content images: write descriptive Italian alt text that:
   - Describes what's in the image
   - Includes natural keywords where relevant (e.g. "cocktail bar Milano", "bartender preparare cocktail", "Navigli Milano sera")
   - Is under 125 characters
   - Never starts with "Immagine di" or "Foto di"

4. Show a table: file / image src / old alt / new alt.
5. Apply all changes.`},
      {title:'width + height su tutti i <img> — elimina CLS layout shift',desc:'Immagini senza dimensioni causano Cumulative Layout Shift. Verificare tutto il codebase.',tag:'seo',status:'inprog',priority:'medium',
        prompt:`I'm working on an Astro 6 site for Milano Cocktail Days.

Please audit all <img> tags across src/pages/ and src/components/ for missing width/height attributes:

1. Find every <img> that is missing width or height (or both).
2. For each, determine the correct natural dimensions:
   - Check the actual image file in public/images/ or public/logos/
   - Use the displayed/intrinsic size if the file is accessible
   - For SVGs, check the viewBox attribute
3. Add both width and height attributes to every img missing them.
4. Do NOT change loading, fetchpriority, or src attributes.
5. Show a table: file / img src / dimensions added.
6. Run: npm run build — confirm no errors.`},
    ]
  },
  {
    num:'03',title:'Structured Data + AEO',subtitle:'JSON-LD Event · FAQPage · Organization · Offers',color:'#5BC4C4',
    tasks:[
      {title:'JSON-LD Event in BaseLayout con pageType="event"',desc:'Già implementato. name, organizer (Luca Ferrara + Nicole Zattarin), location Milano, url.',tag:'geo',status:'done',priority:'high',prompt:NO_PROMPT},
      {title:'JSON-LD FAQPage su index, bar, sponsor',desc:'Già implementato con le FAQ esistenti di ogni pagina.',tag:'geo',status:'done',priority:'high',prompt:NO_PROMPT},
      {title:'Compila startDate e endDate reali nel JSON-LD Event',desc:'Attualmente potrebbe avere placeholder. Inserire le date esatte quando confermate.',tag:'geo',status:'todo',priority:'high',
        prompt:`I'm working on an Astro 6 site for Milano Cocktail Days (https://milanococktaildays.it).
The event runs for 10 days between April and May 2027 (exact dates TBD).

Please update the JSON-LD Event structured data in src/layouts/BaseLayout.astro:

1. Find the jsonLdEvent object.
2. Update startDate to "2027-04-25T18:00:00+02:00" (placeholder — easy to change later).
3. Update endDate to "2027-05-04T23:59:00+02:00".
4. Add eventStatus: "https://schema.org/EventScheduled"
5. Add eventAttendanceMode: "https://schema.org/OfflineEventAttendanceMode"
6. Verify organizer array has both:
   { "@type": "Person", "name": "Luca Ferrara" }
   { "@type": "Person", "name": "Nicole Zattarin" }
7. Verify location uses City type with addressLocality: "Milano", addressCountry: "IT"
8. Run: npm run build — confirm no errors.
NOTE: Add a comment next to startDate/endDate: // UPDATE WHEN DATES CONFIRMED
Show the final jsonLdEvent object.`},
      {title:'Aggiungi offers al JSON-LD Event (prezzo pass €6)',desc:'schema.org/Offer con price, priceCurrency, availability. Aumenta probabilità rich results.',tag:'geo',status:'todo',priority:'medium',
        prompt:`I'm working on an Astro 6 site for Milano Cocktail Days.
The event has a pass that gives access to 30 cocktail bars for 10 days. Each cocktail costs €6.

Please add an "offers" field to the JSON-LD Event in src/layouts/BaseLayout.astro:

Add inside jsonLdEvent:
"offers": {
  "@type": "Offer",
  "name": "Pass Milano Cocktail Days",
  "price": "TBD",
  "priceCurrency": "EUR",
  "availability": "https://schema.org/PreOrder",
  "url": "https://milanococktaildays.it/contatti/"
}

Also add "description" to each FAQ answer in the FAQPage JSON-LD if missing —
answers should be at least 50 characters for Google to show them as rich results.

Run: npm run build — confirm no errors.
Validate at: https://search.google.com/test/rich-results`},
      {title:'Valida JSON-LD su Rich Results Test — nessun errore',desc:'Ogni errore nel structured data impedisce i rich results su Google.',tag:'geo',status:'waiting',priority:'high',
        link:'https://search.google.com/test/rich-results',linkLabel:'Apri Rich Results Test →',prompt:NO_PROMPT},
    ]
  },
  {
    num:'04',title:'Google Search Console',subtitle:'Indicizzazione · Performance · Core Web Vitals · Errori',color:'#5B8DEE',
    tasks:[
      {title:'Ownership verificata via TXT record',desc:'Dominio milanococktaildays.it confermato come proprietà.',tag:'analytics',status:'done',priority:'high',prompt:NO_PROMPT},
      {title:'Sitemap inviata — sitemap-index.xml',desc:'Inviata con 11 URL. IT + EN per tutte le pagine principali.',tag:'analytics',status:'done',priority:'high',prompt:NO_PROMPT},
      {title:'URL Inspection — indicizzazione richiesta per pagine principali',desc:'Richiesta per /, /bar/, /festival/, /sponsor/, /contatti/ + versioni /en/.',tag:'analytics',status:'done',priority:'high',prompt:NO_PROMPT},
      {title:'Controlla Coverage report — nessun errore 4xx/5xx',desc:'Search Console → Copertura → verifica zero errori rossi. Qualsiasi 404 va risolto.',tag:'analytics',status:'waiting',priority:'high',
        link:'https://search.google.com/search-console',linkLabel:'Apri Search Console →',prompt:NO_PROMPT},
      {title:'Verifica site:milanococktaildays.it su Google (dopo 7gg)',desc:'Se non appare nulla dopo 7gg dalla richiesta, ri-invia la sitemap e controlla robots.txt.',tag:'analytics',status:'waiting',priority:'high',prompt:NO_PROMPT},
      {title:'Collega Search Console a GA4',desc:'GA4 → Admin → Search Console Links. Vedi quali query portano click e il comportamento post-landing.',tag:'analytics',status:'todo',priority:'medium',
        prompt:`This task is done entirely in Google product dashboards — no code changes needed.

Steps to link Search Console to GA4:
1. Go to https://analytics.google.com
2. Admin → Property Settings → Search Console Links
3. Click "Link" → select your milanococktaildays.it Search Console property

      {title:'Monitora Search Performance settimanalmente',desc:'Query, impressioni, CTR, posizione media. Disponibile dopo ~4 settimane di dati.',tag:'analytics',status:'waiting',priority:'medium',prompt:NO_PROMPT},
    ]
  },
  {

const container=document.getElementById('phases');
function tagClass(t){const m={code:'tag-code',seo:'tag-seo',geo:'tag-geo',analytics:'tag-analytics',legal:'tag-legal',social:'tag-social',content:'tag-content',critical:'tag-critical'};return m[t]||'tag-seo';}
function tagLabel(t){const m={code:'CODE',seo:'SEO',geo:'GEO',analytics:'ANALYTICS',legal:'LEGAL',social:'SOCIAL',content:'CONTENT',critical:'⚠ CRITICAL'};return m[t]||t.toUpperCase();}
function statusClass(s){const m={done:'status-done',inprog:'status-inprog',todo:'status-todo',waiting:'status-waiting'};return m[s]||'status-todo';}
function statusLabel(s){const m={done:'✓ Fatto',inprog:'In corso',todo:'Da fare',waiting:'In attesa'};return m[s]||s;}

data.forEach((phase,pi)=>{
  const el=document.createElement('div');
  el.className='phase'+(pi<2?' open':'');
  const doneCount=phase.tasks.filter(t=>t.status==='done').length;
  const total=phase.tasks.length;
  const pct=Math.round((doneCount/total)*100);
  el.innerHTML=`
    <div class="phase-header">
      <div class="phase-accent" style="background:${phase.color}"></div>
      <div class="phase-meta">
        <div class="phase-num">Fase ${phase.num}</div>
        <div class="phase-title">${phase.title}</div>
        <div class="phase-subtitle">${phase.subtitle}</div>
      </div>
      <div class="phase-stats">
        <div>
          <div class="phase-count" id="cnt-${pi}">${doneCount}/${total}</div>
          <div class="phase-bar-wrap"><div class="phase-bar" id="bar-${pi}" style="width:${pct}%;background:${phase.color}"></div></div>
        </div>
        <span class="phase-arrow">▼</span>
      </div>
    </div>
    <div class="tasks" id="tasks-${pi}"></div>`;
  el.querySelector('.phase-header').addEventListener('click',()=>el.classList.toggle('open'));
  container.appendChild(el);
  const tasksEl=el.querySelector('.tasks');
  phase.tasks.forEach((task)=>{
    const row=document.createElement('div');
    row.className='task'+(task.status==='done'?' done':'');
    const hasPrompt=task.prompt&&task.prompt!==null;
    row.innerHTML=`
      <div class="task-check"></div>
      <div class="task-body">
        <div class="task-title">${task.title}</div>
        <div class="task-desc">${task.desc}</div>
        ${task.link?`<a class="task-link" href="${task.link}" target="_blank" rel="noopener">↗ ${task.linkLabel}</a>`:''}
      </div>
      <div class="task-right">
        <span class="tag ${tagClass(task.tag)}">${tagLabel(task.tag)}</span>
        <span class="status ${statusClass(task.status)}">${statusLabel(task.status)}</span>
        <div class="priority p-${task.priority}"></div>
      </div>`;
    row.querySelector('.task-check').addEventListener('click',(e)=>{
      e.stopPropagation();
      row.classList.toggle('done');
      updatePhase(pi,phase);
      updateGlobal();
    });
    tasksEl.appendChild(row);
    if(hasPrompt){
      const promptWrap=document.createElement('div');
      promptWrap.className='prompt-open';
      promptWrap.innerHTML=`
        <div class="prompt-toggle">
          <span class="prompt-toggle-icon">▼</span>
          <span>Prompt Claude Code</span>
        </div>
        <div class="prompt-panel">
          <div class="prompt-header">
            <span class="prompt-label">⌘ Claude Code Prompt</span>
            <button class="prompt-copy">Copia</button>
          </div>
          <div class="prompt-body">${task.prompt.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
        </div>`;
      const toggle=promptWrap.querySelector('.prompt-toggle');
      const panel=promptWrap.querySelector('.prompt-panel');
      const icon=promptWrap.querySelector('.prompt-toggle-icon');
      panel.style.display='block';
      toggle.addEventListener('click',()=>{
        const open=panel.style.display!=='none';
        panel.style.display=open?'none':'block';
        icon.style.transform=open?'rotate(-90deg)':'rotate(0deg)';
      });
      const copyBtn=promptWrap.querySelector('.prompt-copy');
      copyBtn.addEventListener('click',(e)=>{
        e.stopPropagation();
        navigator.clipboard.writeText(task.prompt).then(()=>{
          copyBtn.textContent='Copiato ✓';
          copyBtn.classList.add('copied');
          setTimeout(()=>{copyBtn.textContent='Copia';copyBtn.classList.remove('copied');},2000);
        });
      });
      tasksEl.appendChild(promptWrap);
    }
  });
});

function updatePhase(pi,phase){
  const tasksEl=document.getElementById('tasks-'+pi);
  const done=tasksEl.querySelectorAll('.task.done').length;
  const total=phase.tasks.length;
  const pct=Math.round((done/total)*100);
  document.getElementById('cnt-'+pi).textContent=`${done}/${total}`;
  document.getElementById('bar-'+pi).style.width=pct+'%';
}
function updateGlobal(){
  const all=document.querySelectorAll('.phase .task');
  const done=document.querySelectorAll('.phase .task.done');
  const pct=all.length?Math.round((done.length/all.length)*100):0;
  const circ=2*Math.PI*22;
  document.getElementById('ring-fill').style.strokeDashoffset=circ-(circ*pct/100);
  document.getElementById('ring-pct').textContent=pct+'%';
  document.getElementById('global-count').textContent=`${done.length} / ${all.length}`;
}
updateGlobal();
